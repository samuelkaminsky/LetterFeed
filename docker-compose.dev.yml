services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      LETTERFEED_PRODUCTION: "false"
    volumes:
      - letterfeed_data:/data
    networks:
      - letterfeed_network
    deploy:
      resources:
        limits:
          memory: 350M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LETTERFEED_BACKEND_URL: ${LETTERFEED_BACKEND_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - letterfeed_network
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  letterfeed_data:

networks:
  letterfeed_network:
    driver: bridge
